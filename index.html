<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist RXD | Official Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f11; color: #ffffff; text-align: center; }
    header { padding: 60px 20px; background: radial-gradient(circle, #2a1b40, #0f0f11); }
    h1 { font-size: 2.8rem; color: #bb86fc; margin-bottom: 10px; }
    p.subtitle { font-size: 1.1rem; color: #a0a0a0; margin-bottom: 20px; }
    .social-links a { display: inline-block; margin: 5px 10px; padding: 8px 18px; color: #03dac6; border: 1px solid #03dac6; border-radius: 20px; text-decoration: none; }
    .portfolio-section { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #1e1e24; border-radius: 10px; padding: 20px; border: 1px solid #2d2d35; }
    .card h3 { color: #bb86fc; margin-bottom: 8px; }
    .card p { color: #b0b0b0; font-size: 0.9rem; }
    footer { padding: 20px; color: #666; border-top: 1px solid #222; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <h1>ARTIST RXD</h1>
    <p class="subtitle">Digital Creator | Artist | Musician</p>
    <div class="social-links">
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="https://youtube.com" target="_blank">YouTube</a>
    </div>
  </header>
  <section class="portfolio-section">
    <h2>My Creative Work</h2>
    <div class="grid">
      <div class="card">
        <h3>🎨 Digital Art</h3>
        <p>Custom illustrations & designs.</p>
      </div>
      <div class="card">
        <h3>🎵 Music</h3>
        <p>Original tracks & beats.</p>
      </div>
    </div>
  </section>
  <footer>
    <p>&copy; 2026 Artist RXD. All rights reserved.</p>
  </footer>
</body>
</html>
